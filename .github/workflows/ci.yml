name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.node == 22 && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        name: Synchronize package-lock metadata once
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync v0.8 npm lockfile"
          git push origin HEAD:${{ github.head_ref }}
      - run: npm ci
      - run: npm run ci
      - if: matrix.node == 22
        run: npm audit --audit-level=high
      - if: matrix.node == 22
        run: npm run release:tag-check -- v$(node -p "require('./package.json').version")
      - if: matrix.node == 22
        run: node scripts/build-release-artifacts.mjs
